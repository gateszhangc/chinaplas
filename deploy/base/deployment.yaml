apiVersion: apps/v1
kind: Deployment
metadata:
  name: chinaplas-web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chinaplas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chinaplas
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: web
          image: ghcr.io/gateszhangc/chinaplas-site:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
