name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/overlays/prod/kustomization.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: chinaplas-release
  cancel-in-progress: true

env:
  NAMESPACE: chinaplas-prod
  KUSTOMIZATION_FILE: deploy/overlays/prod/kustomization.yaml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Derive build metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          JOB_NAME="chinaplas-build-${GITHUB_SHA::12}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure namespace and pull secrets exist
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry registry-credentials \
            --docker-server="ghcr.io" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ github.token }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic git-clone-token \
            --from-literal=token="${{ github.token }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render build job
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          JOB_NAME: ${{ steps.meta.outputs.job_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          template = Path("deploy/build/kaniko-job.yaml").read_text()
          replacements = {
              "__JOB_NAME__": os.environ["JOB_NAME"],
              "__NAMESPACE__": os.environ["NAMESPACE"],
              "__IMAGE_NAME__": f"{os.environ['IMAGE_NAME']}:{os.environ['IMAGE_TAG']}",
              "__GITHUB_REPOSITORY__": os.environ["GITHUB_REPOSITORY"],
              "__GIT_REF__": os.environ["GITHUB_SHA"],
          }
          for placeholder, value in replacements.items():
              template = template.replace(placeholder, value)
          Path("/tmp/kaniko-job.yaml").write_text(template)
          PY

      - name: Run in-cluster build job
        env:
          JOB_NAME: ${{ steps.meta.outputs.job_name }}
        run: |
          kubectl -n "$NAMESPACE" delete job "$JOB_NAME" --ignore-not-found=true
          kubectl -n "$NAMESPACE" apply -f /tmp/kaniko-job.yaml
          set +e
          kubectl -n "$NAMESPACE" wait --for=condition=Complete --timeout=25m "job/$JOB_NAME"
          STATUS=$?
          kubectl -n "$NAMESPACE" logs "job/$JOB_NAME" --all-containers=true --prefix=true || true
          kubectl -n "$NAMESPACE" delete job "$JOB_NAME" --ignore-not-found=true
          exit $STATUS

      - name: Update production image tag
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: node scripts/update-kustomization.js "$KUSTOMIZATION_FILE" "$IMAGE_NAME" "$IMAGE_TAG"

      - name: Commit release manifest
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: release chinaplas ${IMAGE_TAG}"
          git push origin HEAD:main
